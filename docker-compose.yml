version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: libratrack-postgres
    environment:
      POSTGRES_DB: libratrack
      POSTGRES_USER: libratrack
      POSTGRES_PASSWORD: libratrack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libratrack -d libratrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
